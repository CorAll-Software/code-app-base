<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="build-version" content="<%- buildVersion %>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>App Base · CorAll</title>
  <meta name="description" content="Plantilla base CorAll — Bun + Elysia + PostgreSQL + React + Ant Design">
  <meta name="theme-color" content="#251f5b" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:url" content="%VITE_PUBLIC_URL%">
  <meta property="og:type" content="website">
  <meta property="og:title" content="App Base · CorAll">
  <meta property="og:description" content="Plantilla base CorAll">
  <meta property="og:image" content="%VITE_PUBLIC_URL%/og-image.webp">

  <!-- Manifest -->
  <meta name="apple-mobile-web-app-title" content="App Base" />
  <link rel="manifest" href="/site.webmanifest" />

  <script>
    window._isMobile = navigator?.userAgentData?.mobile || false;
    window._buildInfo = (() => {
      const buildMeta = document.querySelector("meta[name='build-version']")
      if (buildMeta) {
        const build = buildMeta.getAttribute('content')
        console.log(`%cBuild ${build}`, 'color: #0e7490; font-size: 1em; font-weight: bold;')
        const [code, device, date] = build.split('.')
        const datetime = parseInt(code.toLowerCase(), 36) * 10000
        return { code, device, datetime, updated: false, date }
      }
    })();

    const publicUrl = "%VITE_PUBLIC_URL%"
    const apiUrl = "%VITE_API_URL%"
    const wsUrl = "%VITE_WS_URL%"
    const capApiEndpoint = "%VITE_CAP_API_ENDPOINT%"
    const umamiScriptUrl = "%VITE_UMAMI_SCRIPT_URL%"
    const umamiWebsiteId = "%VITE_UMAMI_WEBSITE_ID%"

    const isEnvValue = (value) => value && !value.startsWith('%VITE_')

    const isDevelopment = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')

    window._routeApi = isEnvValue(apiUrl)
      ? apiUrl
      : (isDevelopment ? 'http://localhost:3000/api/' : '/api/');

    window._routeWs = isEnvValue(wsUrl)
      ? wsUrl
      : (isDevelopment ? 'ws://localhost:3000/ws/' : '/ws/');

    // Cap (CAPTCHA autoalojado). Vacío = desactivado (plantilla sin instancia Cap).
    window._routeCaptcha = isEnvValue(capApiEndpoint) ? capApiEndpoint : '';

    if (!isDevelopment && isEnvValue(umamiScriptUrl) && isEnvValue(umamiWebsiteId)) {
      const script = document.createElement('script');
      script.defer = true;
      script.src = umamiScriptUrl;
      script.setAttribute('data-website-id', umamiWebsiteId);
      document.head.appendChild(script);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
