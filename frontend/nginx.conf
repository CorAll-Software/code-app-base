# Sin bloque /ws: el WebSocket va directo a la API (VITE_WS_URL). Si hiciera
# falta proxearlo aquí, apuntar al upstream del backend, nunca a 127.0.0.1
# (es este mismo nginx y se llamaría a sí mismo).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
