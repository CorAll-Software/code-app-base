# Sin bloque /ws: el WebSocket del SPA va directo al host de la API
# (VITE_WS_URL). El que había hacía proxy_pass a http://127.0.0.1, que es este
# mismo nginx en el puerto 80: una sola petición a /ws se reenviaba a sí misma
# hasta agotar las conexiones. Si un proyecto necesita proxear /ws desde aquí,
# que apunte al upstream real del backend, nunca a 127.0.0.1.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
